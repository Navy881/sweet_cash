<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>Sweet Cash - Изменение пароля</title>
    <link rel="stylesheet" href="https://bsikpg.duckdns.org/styles/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://bsikpg.duckdns.org/src/modules/auth/asserts/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://bsikpg.duckdns.org/src/modules/auth/asserts/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://bsikpg.duckdns.org/src/modules/auth/asserts/favicon-16x16.png">
    <link rel="manifest" href="https://bsikpg.duckdns.org/src/modules/auth/asserts/site.webmanifest">
    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/22c45d22f8.js" crossorigin="anonymous"></script>
    <style>
        .changePasswordContainer {
            width: 310px;
            border: 1px solid #606266;
            border-radius: 5px;
            padding: 19px 25px 19px 25px;
            text-align: center;
        }

        .changePasswordContainer input {
            width: 253px;
            padding: 10px;
            height: 32px;
            border: 1px solid #606266;
            border-radius: 4px;
            margin-top: 31px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            height: 32px;
            margin-top: 36px;
        }

        .SubmitButton {
            background-color: #3a8ee6;
            color: #fff;
            width: 124px;
            border-radius: 4px;
            cursor: pointer;
            transform: translateX(3px);
            border: 3px solid transparent;
        }

        .SubmitButton:hover {
            background-color: #2f86e4;
        }

        .SubmitButton.disable{
            pointer-events: none;
            background-color: #409eff;
            opacity: 0.5;
        }

        .textPasswordRepeatError {
            color: var(--error);
            font-size: 10px;
            position: absolute;
            display: none;
            width: 253px;
            text-align: left;
        }

        .textPasswordRepeatError.view {
            position: absolute;
            display: block;
            margin-left: 3px;
            margin-top: 1px;
            width: 253px;
        }

        .textPasswordRepeatError2 {
            color: var(--error);
            font-size: 10px;
            position: absolute;
            display: none;
            width: 253px;
            text-align: left;
        }

        .textPasswordRepeatError2.view {
            position: absolute;
            display: block;
            margin-left: 3px;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <h1>Sweet Cash</h1>
            <div class="changePasswordContainer">
                <div>
                    <h2>Смена пароля</h2>
                </div>

                <div class="password-1">
                    <input
                        placeholder="Новый пароль"
                        id="InputPassword"
                        name="password"
                        onfocus="this.className='active'"
                        title="Должен соддержать не менее 8 символов, цифру, латинские буквы в верхнем и нижнем регистре и специальный символ @$!%*#?&"
                        type="password"
                    />
                    <div class="textPasswordError" id='errorpass1'> Пароль должен содержать минимум 8 символов</div>
                    <div class="textPasswordError2" id='errorpass2'> Пароль должен содержать только буквы (a–z, A–Z), цифры и символы: @$!%*#?&</div>
                    <i id="eye-1" class="fa-regular fa-eye-slash"></i>
                </div>

                <div class="password-1">
                    <input
                    placeholder="Подтвердите пароль"
                    id="InputPasswordRepeat"
                    name="password"
                    onfocus="this.className='active'"
                    title="Повторите ранее введенный пароль"
                    type="password"
                    />
                    <div class="textPasswordRepeatError" id='errorpass1'> Пароль должен содержать минимум 8 символов</div>
                    <div class="textPasswordRepeatError2" id='errorpass2'> Пароль должен содержать только буквы (a–z, A–Z), цифры и символы: @$!%*#?&</div>
                    <div class="textPasswordErrorRepeat"> Пароли не совпадают.</div>
                    <i id="eye-2" class="fa-regular fa-eye-slash"></i>
                </div>
                <div class="buttons">
                    <button type="submit" value="send" id="SubmitButton" class="SubmitButton disable" >
                        Подтвердить</button>
                </div>
            </div>
        </div>
    </div>

<script>
    //const password1 = document.getElementById('InputPassword');
    //const password2 = document.getElementById('InputPasswordRepeat');
    //const submitButton = document.getElementById('SubmitButton');

    const password = document.getElementById("InputPassword");
    const passwordRepeat = document.getElementById("InputPasswordRepeat");
    const submitButton = document.getElementById("SubmitButton");
    const textPasswordErrorRepeat = document.querySelector(".textPasswordErrorRepeat");
    const textPasswordError = document.querySelector(".textPasswordError");
    const textPasswordError2 = document.querySelector(".textPasswordError2");
    const textPasswordRepeatError = document.querySelector(".textPasswordRepeatError");
    const textPasswordRepeatError2 = document.querySelector(".textPasswordRepeatError2");
    const eyecon1 = document.getElementById("eye-1");
    const eyecon2 = document.getElementById("eye-2");
    const reg =
            /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$/;

    function checkForm() {
        if (password.value && passwordRepeat.value) {
            submitButton.classList.remove("disable");
        } else {
            submitButton.classList.add("disable");
        }
    }

    function validatePassword() {
        console.log(password.length);
        if (password.value.length < 8) {
            removePasswordError()
            password.classList.add("PasswordError");
            textPasswordError.classList.add("view");
            submitButton.classList.add("disable");
        } else if (reg.test(password.value) === false) {
            removePasswordError()
            password.classList.add("PasswordError");
            textPasswordError2.classList.add("view");
            submitButton.classList.add("disable");
        }
    }

    function validatePasswordRepeat() {
        console.log(passwordRepeat.length);
        if (passwordRepeat.value.length < 8) {
            removePasswordRepeatError()
            passwordRepeat.classList.add("PasswordError");
            textPasswordRepeatError.classList.add("view");
            submitButton.classList.add("disable");
        } else if (reg.test(passwordRepeat.value) === false) {
            removePasswordRepeatError()
            passwordRepeat.classList.add("PasswordError");
            textPasswordRepeatError2.classList.add("view");
            submitButton.classList.add("disable");
        }
    }

    async function changePassword() {
        submitButton.classList.add("disable");

        if (password.value !== passwordRepeat.value) {
            passwordRepeat.classList.add("PasswordError");
            textPasswordErrorRepeat.classList.add("view");
            submitButton.classList.add("disable");
            return;
        }

        const email = "{{ email }}";  // Подставляем email
        const code = "{{ code }}";    // Подставляем code
        const new_password = password.value;

        try {
            const response = await fetch('{{ host }}/api/v1/auth/password/change', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, code, new_password })
            });
            console.log(response.status);
            if (response.ok) {
                // Найдем элементы формы, которые нужно скрыть
                //const formElements = document.querySelectorAll('input, button, form, p, h2, i');
                const formElements = document.querySelectorAll('.changePasswordContainer')
                
                // Скрываем все поля ввода и кнопки
                formElements.forEach(element => {
                    element.style.display = 'none';
                });
                
                // Найдем контейнер, в который нужно добавить сообщение
                const container = document.querySelector('.container');
                const targetDiv = container.querySelector('div');

                // Создаем элемент <p> для отображения сообщения
                const messageElement = document.createElement('p');
                targetDiv.appendChild(messageElement);

                // Время до редиректа (в секундах)
                let countdown = 5;

                // Функция для обновления текста сообщения
                const updateMessage = () => {
                    messageElement.innerHTML = `Пароль успешно заменён.<br/>
                    Через ${countdown} секунд${countdown === 1 ? 'у' : 'ы'} вы будете переведены на страницу входа.<br/>
                    Если перехода не произошло, то перейдите по <a href="https://bsikpg.duckdns.org">ссылке</a>.`;
                };

                // Обновляем сообщение сразу
                updateMessage();

                // Устанавливаем интервал для обновления таймера каждую секунду
                const intervalId = setInterval(() => {
                    countdown--;
                    updateMessage();

                    // Когда таймер доходит до нуля, выполняем редирект
                    if (countdown <= 0) {
                        clearInterval(intervalId);
                        window.location.href = 'https://bsikpg.duckdns.org';
                    }
                }, 1000);
            } else {
                // Обработка других случаев
                console.log("Другой код состояния:", response.status);
                alert('Ошибка при изменении пароля');
            }
        } catch (error) {
            console.error("Ошибка при выполнении запроса:", error);
            alert('Ошибка при изменении пароля');
        }
    }

    function hidepassword1() {
        if (password.type === "password") {
            password.type = "text";
            eyecon1.classList.remove("fa-eye-slash");
            eyecon1.classList.add("fa-eye");
        } else {
            password.type = "password";
            eyecon1.classList.remove("fa-eye");
            eyecon1.classList.add("fa-eye-slash");
        }
    }

    function hidepassword2() {
        if (passwordRepeat.type === "password") {
            passwordRepeat.type = "text";
            eyecon2.classList.add("fa-eye");
            eyecon2.classList.remove("fa-eye-slash");
        } else {
            passwordRepeat.type = "password";
            eyecon2.classList.remove("fa-eye");
            eyecon2.classList.add("fa-eye-slash");
        }
    }

    function removePasswordError() {
        textPasswordError.classList.remove("view");
        textPasswordError2.classList.remove("view");   
    }

    function removePasswordRepeatError() {
        textPasswordRepeatError.classList.remove("view");
        textPasswordRepeatError2.classList.remove("view");   
    }

    function removeErrorPasswordRepeat() {
        textPasswordErrorRepeat.classList.remove("view");
    }

    password.addEventListener("input", checkForm);
    password.addEventListener("input", validatePassword);

    passwordRepeat.addEventListener("input", checkForm);
    passwordRepeat.addEventListener("input", validatePasswordRepeat);

    password.addEventListener("focus", removePasswordError);
    passwordRepeat.addEventListener("focus",removePasswordRepeatError);
    passwordRepeat.addEventListener("focus",removeErrorPasswordRepeat);
    
    submitButton.addEventListener("click", changePassword);

    eyecon1.addEventListener("click", hidepassword1);
    eyecon2.addEventListener("click", hidepassword2);

</script>

</body>
</html>
